<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/IMG-20260824-WA0035.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <title>AccessHub | Multi-Tenant Admin</title>
</head>

<body>

    <header class="navbar">
        <a class="brand" href="#">
            <img src="/IMG-20260824-WA0035.jpg" alt="AccessHub logo">
            <span>Access<span>Hub</span> 👑 Admin</span>
        </a>

        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="index.html"
                style="color: var(--navy); text-decoration: none; font-weight: 600; font-size: 0.9rem; background: var(--light); padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); transition: background 0.2s;"
                onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background='var(--light)'">
                ← Student Portal
            </a>

            <!-- LOGOUT BUTTON (Hidden initially) -->
            <button id="logoutBtn"
                style="display: none; background: var(--danger); width: auto; padding: 8px 16px; font-size: 0.9rem; margin: 0;">
                Logout 🚪
            </button>
        </div>
    </header>

    <!-- 🔒 THE AUTH GATE (Supports Login & Sign Up!) -->
    <section class="registration" id="adminLoginSection" style="margin-top: 60px;">
        <div class="card-header" style="background: var(--navy); color: white;">
            <h2 id="authCardTitle">Instructor Portal 🔐</h2>
        </div>

        <form id="adminLoginForm" style="padding: 40px;">
            <p id="authSubtitle" style="text-align: center; color: var(--muted); margin-bottom: 20px;">Authenticate to
                access your command center.</p>

            <!-- Optional Name Field for Registration -->
            <div class="field" id="nameFieldContainer" style="display: none;">
                <label for="instructorName">Organization / Instructor Name</label>
                <input id="instructorName" type="text" placeholder="e.g. CodeAcademy Inc.">
            </div>

            <div class="field">
                <label for="adminEmail">Email Address</label>
                <input id="adminEmail" type="email" required placeholder="instructor@school.com">
            </div>

            <div class="field">
                <label for="adminPassword">Password</label>
                <input id="adminPassword" type="password" required placeholder="••••••••">
            </div>

            <button id="adminLoginBtn" type="submit" style="margin-top: 20px;">Secure Login 🛡️</button>

            <!-- Toggle between Login and Sign Up -->
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted);">
                <span id="toggleText">New instructor?</span>
                <button type="button" id="authModeToggleBtn"
                    style="background: none; color: var(--teal); border: none; padding: 0; width: auto; display: inline; font-weight: bold; cursor: pointer;">Create
                    an account</button>
            </p>
        </form>
    </section>

    <!-- 🎛️ THE ISOLATED COMMAND CENTER -->
    <main class="dashboard-container" id="adminDashboard">

        <!-- 1. SESSION CONTROLS -->
        <section class="registration" style="margin: 0 auto 30px; width: 100%;">
            <div class="card-header">
                <h2>Live Session Controls 🎛️</h2>
            </div>
            <div style="padding: 40px; text-align: center; background: white;">

                <!-- SESSION NAME FIELD -->
                <div class="field" id="sessionInputGroup"
                    style="text-align: left; max-width: 400px; margin: 0 auto 20px;">
                    <label for="sessionTitle">Class / Session Title</label>
                    <input id="sessionTitle" type="text" placeholder="e.g. MATH 101 - Morning Lecture" required>
                </div>

                <button id="generateCodeBtn" type="button" style="max-width: 400px; margin: 0 auto;">
                    Open Class & Generate Code 🚀
                </button>

                <div id="activeSessionDiv" style="display: none; margin-top: 20px;">
                    <p id="activeSessionTitleDisplay"
                        style="font-size: 1.1rem; color: var(--navy); font-weight: bold; margin-bottom: 5px;"></p>
                    <p style="font-weight: 700; color: var(--muted); text-transform: uppercase;">Students, enter this
                        code:</p>
                    <h2 id="liveCode" class="code-display">----</h2>
                    <br>
                    <button id="closeSessionBtn" type="button"
                        style="background: var(--danger); max-width: 400px; margin: 0 auto;">
                        Close Class & Export CSV 📥
                    </button>
                </div>

            </div>
        </section>

        <!-- 2. LIVE COUNT CARD -->
        <div class="stats-card">
            <h3 style="color: var(--muted); text-transform: uppercase; letter-spacing: 2px;">Total Present</h3>
            <div id="liveCount" class="count-display">0</div>
            <p style="color: var(--teal); font-weight: bold;">Students verified in real-time ⚡</p>
        </div>

        <!-- 3. LIVE ATTENDEE LIST -->
        <section class="registration" style="margin: 0 auto; width: 100%;">
            <div class="card-header" style="background: var(--teal); color: var(--navy);">
                <h2>Verified Roster 📋</h2>
            </div>
            <div style="padding: 30px; background: white;">
                <ul class="attendee-list" id="adminAttendeeList">
                    <p id="emptyState" style="text-align: center; color: var(--muted);">Waiting for students to join...
                    </p>
                </ul>
            </div>
        </section>

    </main>

    <div id="toastContainer"></div>

    <!-- 🪟 CUSTOM MODAL -->
    <div id="modalOverlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-icon" id="modalIcon"></span>
                <span class="modal-title" id="modalTitle"></span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
