<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/IMG-20260824-WA0035.jpg">
    <link rel="stylesheet" href="style.css">
    <title>AccessHub | Secure Admin</title>
</head>

<body>

    <header class="navbar">
        <a class="brand" href="#">
            <img src="/IMG-20260824-WA0035.jpg" alt="AccessHub logo">
            <span>Access<span>Hub</span> 👑 Admin</span>
        </a>
    </header>

    <!-- 🔒 THE SECURITY GATE (Real Firebase Auth) -->
    <section class="registration" id="adminLoginSection" style="margin-top: 60px;">
        <div class="card-header" style="background: var(--navy); color: white;">
            <h2>Admin Portal 🔐</h2>
        </div>
        <form id="adminLoginForm" style="padding: 40px;">
            <p style="text-align: center; color: var(--muted); margin-bottom: 20px;">Please authenticate to access the
                command center.</p>

            <div class="field">
                <label for="adminEmail">Admin Email</label>
                <input id="adminEmail" type="email" required placeholder="admin@accesshub.com">
            </div>

            <div class="field">
                <label for="adminPassword">Password</label>
                <input id="adminPassword" type="password" required placeholder="••••••••">
            </div>

            <button id="adminLoginBtn" type="submit" style="margin-top: 20px;">Secure Login 🛡️</button>
        </form>
    </section>

    <!-- 🎛️ THE HIDDEN COMMAND CENTER -->
    <main class="dashboard-container" id="adminDashboard">

        <!-- 1. SESSION CONTROLS -->
        <section class="registration" style="margin: 0 auto 30px; width: 100%;">
            <div class="card-header">
                <h2>Live Session Controls 🎛️</h2>
            </div>
            <div style="padding: 40px; text-align: center; background: white;">

                <button id="generateCodeBtn" type="button" style="max-width: 400px; margin: 0 auto;">
                    Open Class & Generate Code 🚀
                </button>

                <div id="activeSessionDiv" style="display: none; margin-top: 30px;">
                    <p style="font-weight: 700; color: var(--muted); text-transform: uppercase;">Students, enter this
                        code:</p>
                    <h2 id="liveCode" class="code-display">----</h2>
                    <br>
                    <button id="closeSessionBtn" type="button"
                        style="background: var(--danger); max-width: 400px; margin: 0 auto;">
                        Close Class & Export CSV 📥
                    </button>
                </div>

            </div>
        </section>

        <!-- 2. LIVE COUNT CARD -->
        <div class="stats-card">
            <h3 style="color: var(--muted); text-transform: uppercase; letter-spacing: 2px;">Total Present</h3>
            <div id="liveCount" class="count-display">0</div>
            <p style="color: var(--teal); font-weight: bold;">Students verified in real-time ⚡</p>
        </div>

        <!-- 3. LIVE ATTENDEE LIST -->
        <section class="registration" style="margin: 0 auto; width: 100%;">
            <div class="card-header" style="background: var(--teal); color: var(--navy);">
                <h2>Verified Roster 📋</h2>
            </div>
            <div style="padding: 30px; background: white;">
                <ul class="attendee-list" id="adminAttendeeList">
                    <p id="emptyState" style="text-align: center; color: var(--muted);">Waiting for students to join...
                    </p>
                </ul>
            </div>
        </section>

    </main>

    <!-- The magic toast container! -->
    <div id="toastContainer"></div>

    <!-- Linking to our upcoming JavaScript brain! 🧠 -->
    <script type="module" src="admin.js"></script>
</body>

</html>
